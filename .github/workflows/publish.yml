name: Publish to npm

# 推送 v* tag 时，通过 npm Trusted Publishing (OIDC) 发布到 npm。
# 发布前请在 npmjs.com 为 @czf1995/dsh-waste-market 配置 Trusted Publisher:
#   Owner: a23842  Repository: dsh-waste-market  Workflow: publish.yml

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC Trusted Publishing 必需
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          # 不设 registry-url：避免 setup-node 往 .npmrc 写入
          # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} 占位行。
          # 该行在未设 NODE_AUTH_TOKEN 时解析为空 token，会顶掉 OIDC
          # Trusted Publishing 流程，导致 publish 以空凭据 PUT → 404。

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG pkg=$PKG node=$(node -v) npm=$(npm -v)"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json version $PKG 不一致"
            exit 1
          fi

      - name: Ensure npm >= 11.5.1 (OIDC Trusted Publishing)
        run: |
          npm install -g npm@latest
          echo "npm now = $(npm -v)"

      - name: Publish
        run: npm publish --access public
