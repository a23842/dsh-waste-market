name: Publish to npm

# 推送 v* tag 时，通过 npm Trusted Publishing (OIDC) 发布到 npm。
# 发布前请在 npmjs.com 为 @czf1995/dsh-waste-market 配置 Trusted Publisher:
#   Owner: a23842  Repository: dsh-waste-market  Workflow: publish.yml

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC Trusted Publishing 必需
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG pkg=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json version $PKG 不一致"
            exit 1
          fi

      - name: Ensure npm >= 11.5.1 (OIDC support)
        run: npm install -g npm@latest

      - name: Publish
        run: npm publish --access public
